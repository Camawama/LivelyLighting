mod_description=Dynamic lighting that knows Valkyrien Skies, Create and Colorful Lighting: held, worn and burning lights and the lamps of moving ships and contraptions, drawn on the client as Minecraft's own light spreads, or placed as light blocks by the server for clients without the mod. Works on the server alone, on the client alone, or both.
