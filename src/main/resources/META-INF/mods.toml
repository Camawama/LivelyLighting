modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="IGNORE_SERVER_VERSION"
description='''${mod_description}'''
logoFile="assets/livelylighting/logo.png"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Camafy, the shared CamaCraft library: required. Lively Lighting reaches Valkyrien
# Skies only through it. Server-side only, like Lively Lighting itself.
[[dependencies.${mod_id}]]
    modId="camafy"
    mandatory=true
    versionRange="${camafy_version_range}"
    ordering="AFTER"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="valkyrienskies"
    mandatory=false
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"
