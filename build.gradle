buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Xms4G', '-Xmx6G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Its own directory, so automated runs never rotate the logs or delete the world of a
            // manual runServer session.
            workingDirectory project.file('run-gametest')
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // Camafy (the shared CamaCraft library) is published here by its own `publishToMavenLocal`.
    mavenLocal()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Client-only mods for runClient. A dedicated server (runServer, runGameTestServer) refuses to
    // load them ("invalid dist DEDICATED_SERVER"), so they stay off the classpath of those runs.
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('server') }) {
        runtimeOnly fg.deobf("curse.maven:cubes-without-borders-975120:5855464")
        runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
    }
    // Embeddium's options API for the settings page (client.EmbeddiumOptions, loaded only when Embeddium is present)
    compileOnly fg.deobf("curse.maven:embeddium-908741:5681725")
    runtimeOnly fg.deobf("curse.maven:starlight-forge-526854:4631193")
    runtimeOnly fg.deobf("curse.maven:spark-361579:4738952")
    //runtimeOnly fg.deobf("curse.maven:true-darkness-forge-updated-fork-970641:5080314")
    //runtimeOnly fg.deobf("curse.maven:colorful-lighting-sodium-compat-1373023:7997994")

    // Camafy: required. All Valkyrien Skies access goes through its ship facade
    // (net.camacraft.camafy.compat.vs), so VS isn't needed at compile time.
    implementation fg.deobf("net.camacraft.camafy:camafy:${camafy_version}")

    // --- VS2 (dev runtime only) ---
    // Camafy's VS support needs VS 2.4.11+. Modrinth's copy of the 2.4.11 jar has a
    // dependency-free POM (the VS maven's drags in Create, Twilight Forest, ...).
    runtimeOnly fg.deobf("thedarkcolour:kotlinforforge:4.11.0")
    runtimeOnly fg.deobf("maven.modrinth:valkyrien-skies:pOkdwuUh") // 1.20.1-forge-2.4.11

    implementation("org.joml:joml:1.10.5")
    implementation "net.jodah:typetools:0.6.3"
}

apply plugin: 'org.spongepowered.mixin'
mixin {
    add sourceSets.main, "livelylighting.refmap.json"
    config "livelylighting.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, camafy_version_range: camafy_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'livelylighting.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/*
 * Every gametest run starts from a fresh, flat, fixed-seed, empty world (the same setup as the
 * other CamaCraft mods' suites): a dedicated gametest server otherwise generates normal terrain
 * on a random seed.
 */
tasks.register('cleanGameTestWorld', Delete) {
    group = 'verification'
    description = 'Deletes the saved gametest world so each run starts clean.'
    delete file('run-gametest/world')
}

tasks.register('gameTestServerProperties') {
    group = 'verification'
    description = 'Forces the gametest world to be flat, fixed-seed and empty.'

    doLast {
        def file = file('run-gametest/server.properties')
        file.parentFile.mkdirs()

        def props = new Properties()
        if (file.exists()) {
            file.withInputStream { props.load(it) }
        }

        props.setProperty('level-type', 'minecraft:flat')
        props.setProperty('level-seed', '0')
        props.setProperty('generate-structures', 'false')
        props.setProperty('spawn-monsters', 'false')
        props.setProperty('spawn-animals', 'false')
        props.setProperty('spawn-npcs', 'false')

        file.withOutputStream {
            props.store(it, 'Written by gameTestServerProperties -- see build.gradle')
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'cleanGameTestWorld'
    dependsOn 'gameTestServerProperties'
}
